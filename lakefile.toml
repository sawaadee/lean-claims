# File: lakefile.toml
# Purpose: Lake package configuration for LeanClaims, the Lean side of lean-claims. A
# project requires this package from its test package only, so nothing here reaches the
# code the project ships.
# Created: 2026-11-13

name = "LeanClaims"
license = "Apache-2.0"
version = "0.1.0"
defaultTargets = ["LeanClaims"]

# A warning fails the build. `sorry` is reported as a warning, so an unfinished
# definition here cannot build.
[leanOptions]
warningAsError = true

[[lean_lib]]
name = "LeanClaims"

# The claims and audit theorems the self-test puts to `#audit_facts`. Not a default
# target: a project that requires LeanClaims never builds it.
[[lean_lib]]
name = "LeanClaimsTest"
srcDir = "selftest"
